name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Compile package
        run: python -m compileall -q src
      - name: Audit Python dependencies
        run: python -m pip_audit . --strict --progress-spinner off
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check installed wheel interface
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -m pip install dist/*.whl
          .package-smoke/bin/open-domain-radar --help
      - name: Build container image
        run: |
          docker build --tag open-domain-radar:ci .
          docker run --rm open-domain-radar:ci open-domain-radar --help
