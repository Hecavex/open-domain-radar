name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python scripts/lock_dependencies.py --check
          python -m pip install --require-hashes -r requirements/dev-py312.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Synthetic operator runtime tests
        run: python -m unittest discover -s tests -v
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Compile package
        run: python -m compileall -q src
      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements/runtime-py312.lock --no-deps --disable-pip --strict --progress-spinner off
          python -m pip_audit -r requirements/dev-py312.lock --no-deps --disable-pip --strict --progress-spinner off
      - name: Build source and wheel distributions
        run: python -m build --no-isolation
      - name: Check installed wheel interface
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -m pip install --require-hashes -r requirements/runtime-py312.lock
          .package-smoke/bin/python -m pip install --no-deps dist/*.whl
          .package-smoke/bin/open-domain-radar --help
          .package-smoke/bin/python -m unittest discover -s tests -v
      - name: Build container image
        run: |
          docker build --tag open-domain-radar:ci .
          docker run --rm open-domain-radar:ci open-domain-radar --help
          docker run --rm --network none -v "$PWD/tests:/tests:ro" open-domain-radar:ci python -m unittest discover -s /tests -v
      - name: Check runtime image for fixable high and critical advisories
        run: |
          docker save --output "$RUNNER_TEMP/odr-image.tar" open-domain-radar:ci
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP:/audit" -e TRIVY_CACHE_DIR=/audit/trivy-cache aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --input /audit/odr-image.tar --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --timeout 10m
