services:
  web:
    build: .
    command: ["open-domain-radar", "serve", "--host", "0.0.0.0", "--port", "8787"]
    environment:
      ODR_DATA_DIR: /data
      ODR_PUBLIC_ORIGIN: ${ODR_PUBLIC_ORIGIN:-http://127.0.0.1:8787}
      ODR_EMBED_WORKER: "false"
      ODR_MASTER_KEY: ${ODR_MASTER_KEY:-}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - radar-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  worker:
    build: .
    command: ["open-domain-radar", "worker"]
    environment:
      ODR_DATA_DIR: /data
      ODR_MASTER_KEY: ${ODR_MASTER_KEY:-}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
    volumes:
      - radar-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  radar-data:
